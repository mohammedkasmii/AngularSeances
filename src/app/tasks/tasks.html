@if (tasks.length === 0) {
  <p class="empty">Aucune tâche pour l'instant</p>
} @else {
  <ul>
    @for (task of tasks; track task.id) {
      <li>
        <strong>{{ task.title | uppercase }}</strong>
        <span class="date">— pour le {{ task.dueDate | date: 'dd/MM/yyyy' }}</span>
      </li>
    }
  </ul>
}
