<p>{{ count() }} tâche(s)</p>
<button (click)="addTask()">Ajouter une tâche</button>
<button (click)="clear()">Vider la liste</button>

@if (tasks().length === 0) {
  <p class="empty">Aucune tâche pour l'instant</p>
} @else {
  <ul>
    @for (task of tasks(); track task.id) {
      <li>
        <strong>{{ task.title | uppercase }}</strong>
        @if (task.dueDate) {
          <span class="date">— pour le {{ task.dueDate | date: 'dd/MM/yyyy' }}</span>
          <span class="overdue">{{ task.dueDate | overdue }}</span>
        }
      </li>
    }
  </ul>
}
